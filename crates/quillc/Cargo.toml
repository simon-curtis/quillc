[package]
name = "quillc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bincode = "1.3"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quill-cargo = { path = "../quill-cargo" }
quill-cfg = { path = "../quill-cfg" }
quill-parallel = { path = "../quill-parallel" }
quill-hir = { path = "../quill-hir" }
quill-source = { path = "../quill-source" }
quill-syntax = { path = "../quill-syntax" }
quill-typeck = { path = "../quill-typeck" }
quill-codegen = { path = "../quill-codegen" }
quill-link = { path = "../quill-link" }
quill-query = { path = "../quill-query" }
quill-lsp = { path = "../quill-lsp" }

[[bin]]
name = "quillc"
path = "src/main.rs"
