[package]
name = "quill-syntax"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
quill-cfg = { path = "../quill-cfg" }
quill-source = { path = "../quill-source" }
quill-parallel = { path = "../quill-parallel" }
blake3 = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "=3.0.9", features = ["full", "visit", "visit-mut"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
