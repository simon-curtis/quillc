[package]
name = "quill-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quill-cfg = { path = "../quill-cfg" }
quill-source = { path = "../quill-source" }
quill-parallel = { path = "../quill-parallel" }
blake3 = "1"
ra_ap_syntax = "=0.0.358"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The parser benchmark and the test-only Syn differential oracle.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "=3.0.9", features = ["full", "visit", "visit-mut"] }

[[bench]]
name = "parser_compare"
harness = false
