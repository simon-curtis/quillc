name: Website

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'benchmarks/**'
      - 'website/**'
      - 'scripts/build-website.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build and check the website
        run: |
          python3 scripts/build-website.py
          node --test website/worker.test.mjs
          npx --yes wrangler@4.150.0 deploy --config website/wrangler.jsonc --dry-run --autoconfig false
      - name: Upload website artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quill-website-${{ github.sha }}
          path: target/website/
          if-no-files-found: error
          retention-days: 30
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.150.0 deploy --config website/wrangler.jsonc --autoconfig false
      - name: Verify the deployed revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --output deployed-status.json \
              "https://quill.simoncurtis.dev/project-status.json?deployment=$EXPECTED_REVISION" && \
              python3 -c 'import json,os; assert json.load(open("deployed-status.json"))["revision"] == os.environ["EXPECTED_REVISION"]'; then
              exit 0
            fi
            sleep 5
          done
          echo 'The live website does not report the deployed commit.' >&2
          exit 1
