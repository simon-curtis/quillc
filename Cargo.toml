[workspace]
resolver = "3"
members = [
    "crates/quill-hir",
    "crates/quill-codegen",
    "crates/quill-link",
    "crates/quill-parallel",
    "crates/quill-source",
    "crates/quill-syntax",
    "crates/quill-query",
    "crates/quill-lsp",
    "crates/quill-cargo",
    "crates/quill-cfg",
    "crates/quill-typeck",
    "crates/quillc",
]
exclude = ["benchmarks/catalog-flow"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
